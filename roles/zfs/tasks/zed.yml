---
- name: Installing zfs event daemon
  ansible.builtin.apt:
    name: zfs-zed
    state: present

- name: Setting ZED email address
  when:
    - zfs_smtp is defined
    - zfs_smtp.addr is defined
  ansible.builtin.lineinfile:
    path: /etc/zfs/zed.d/zed.rc
    regexp: "^ZED_EMAIL_ADDR="
    line: 'ZED_EMAIL_ADDR="{{ "bQo=" | b64decode | trim }}@{{
      zfs_smtp.addr }}"'
  notify:
    - Restart zfs-zed

- name: Setting ZED email options with from address
  when:
    - zfs_smtp is defined
    - zfs_smtp.addr is defined
  ansible.builtin.lineinfile:
    path: /etc/zfs/zed.d/zed.rc
    regexp: "^#?ZED_EMAIL_OPTS="
    line: 'ZED_EMAIL_OPTS="-r {{ zfs_smtp_from }}@{{ zfs_smtp.addr }}
      -s ''@SUBJECT@'' @ADDRESS@"'
  notify:
    - Restart zfs-zed

- name: Enabling zfs ZED
  ansible.builtin.systemd:
    enabled: true
    name: zfs-zed.service
