---
- name: Installing zfs event daemon
  ansible.builtin.apt:
    name: zfs-zed
    state: present

- name: Checking if the smtp address has been set
  ansible.builtin.stat:
    get_attributes: false
    get_checksum: false
    get_mime: false
    path: /root/smtp-addr.txt
  register: zfs_smtp_addr_file

- name: Configuring ZED email
  when: zfs_smtp_addr_file.stat.exists
  block:
    - name: Fetching smtp address value
      ansible.builtin.slurp:
        src: /root/smtp-addr.txt
      register: zfs_smtp_addr

    - name: Computing mail addresses
      ansible.builtin.set_fact:
        zfs_mail_domain: "{{ zfs_smtp_addr['content'] | b64decode | trim }}"
        zfs_mail_from: "{{ 'ego=' | b64decode | trim }}"

    - name: Setting ZED email address
      ansible.builtin.lineinfile:
        path: /etc/zfs/zed.d/zed.rc
        regexp: "^ZED_EMAIL_ADDR="
        line: 'ZED_EMAIL_ADDR="{{ "bQo=" | b64decode | trim }}@{{
          zfs_mail_domain }}"'
      notify:
        - Restart zfs-zed

    - name: Setting ZED email options with from address
      ansible.builtin.lineinfile:
        path: /etc/zfs/zed.d/zed.rc
        regexp: "^#?ZED_EMAIL_OPTS="
        line: 'ZED_EMAIL_OPTS="-r {{ zfs_mail_from }}@{{ zfs_mail_domain }}
          -s ''@SUBJECT@'' @ADDRESS@"'
      notify:
        - Restart zfs-zed

- name: Enabling zfs ZED
  ansible.builtin.systemd:
    enabled: true
    name: zfs-zed.service
