---
# this role only supports Debian and its derivatives (Debian, Raspberry Pi OS)
- name: Installing zfs packages
  when:
    - ansible_facts["os_family"] == "Debian"
    - ansible_hostname in zfs_pools
  ansible.builtin.include_tasks: install-debian.yml

- name: Configuring zfs arc cache
  when:
    - ansible_facts["os_family"] == "Debian"
    - ansible_hostname in zfs_pools
  ansible.builtin.include_tasks: arc.yml

- name: Configuring outgoing mail
  when:
    - ansible_facts["os_family"] == "Debian"
    - ansible_hostname in zfs_pools
  ansible.builtin.include_tasks: email.yml

- name: Configuring pool unlocking and scrubbing
  when:
    - ansible_facts["os_family"] == "Debian"
    - ansible_hostname in zfs_pools
    - zfs_pools[ansible_hostname] | length > 0
  ansible.builtin.include_tasks: unlock.yml

- name: Configuring zfs replication account
  when:
    - ansible_facts["os_family"] == "Debian"
    - ansible_hostname in zfs_replication
  ansible.builtin.include_tasks: replication.yml

- name: Configuring zfs snapshots
  when:
    - ansible_facts["os_family"] == "Debian"
    - ansible_hostname in zfs_sanoid
  ansible.builtin.include_tasks: sanoid.yml

- name: Configuring zfs event daemon
  when:
    - ansible_facts["os_family"] == "Debian"
    - ansible_hostname in zfs_pools
    - zfs_pools[ansible_hostname] | length > 0
  ansible.builtin.include_tasks: zed.yml
