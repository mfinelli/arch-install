---
- name: Installing kernel headers (for zfs)
  ansible.builtin.apt:
    name: "{{ zfs_kernel_headers }}"
    state: present

- name: Installing zfs packages
  ansible.builtin.apt:
    name:
      - zfs-dkms
      - zfsutils-linux
    state: present

- name: Installing xxd
  ansible.builtin.apt:
    name: xxd
    state: present
